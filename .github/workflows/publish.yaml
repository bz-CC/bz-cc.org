name: Build and deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: checkout theme
        uses: actions/checkout@v6
        with:
          repository: https://git.colorized.life/demo.colorized.life.git
          path: themes/colorized

      - name: Build site + upload pages artifacts
        uses: getzola/github-pages@v1
        with:
          zola_version: v0.23.4

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
